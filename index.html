<!--
P3 — Página de prueba de los fantasmas.
Se abre aparte de index.html y no toca main.js.
Mismo importmap que index.html: si allá se cambia la versión de Three, cambiarla aquí también.
-->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACMAN SCAPE ROOM · Prueba de fantasmas</title>
    <script type="importmap">
    {
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
    }
    </script>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #05050f; }
        #game canvas { display: block; }

        #ayuda {
            position: fixed;
            left: 8px;
            bottom: 8px;
            color: #fff;
            background: rgba(0, 0, 0, .6);
            padding: 8px 10px;
            border-radius: 6px;
            font: 12px/1.45 monospace;
            pointer-events: none;
            z-index: 10;
        }
    </style>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="game"></div>
    <div id="ayuda">WASD / flechas: mover &nbsp;·&nbsp; las teclas de prueba están en el panel de la derecha</div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
